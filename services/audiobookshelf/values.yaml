app-template:
  fullnameOverride: audiobookshelf
  controllers:
    main:
      pod:
        nodeSelector:
          node-type: infra
      containers:
        main:
          image:
            repository: ghcr.io/advplyr/audiobookshelf
            tag: latest
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
          - name: TZ
            value: Asia/Ho_Chi_Minh
          ports:
          - name: http
            containerPort: 80
  service:
    main:
      enabled: true
      controller: main
      type: NodePort
      ports:
        http:
          enabled: true
          primary: true
          port: 80
          nodePort: 32378
          protocol: HTTP

  ingress:
    main:
      enabled: true
      className: traefik
      annotations: {}
      tls:
        - hosts:
            - audiobook.home.arpa
          secretName: audiobookshelf-tls
      hosts:
      - host: audiobook.home.arpa
        paths:
        - path: "/"
          pathType: Prefix
          service:
            name: main
            port: http
  persistence:
    main-library:
      enabled: true
      type: persistentVolumeClaim
      storageClass: longhorn
      size: 5Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
          - path: "/library"
    main-config:
      enabled: true
      type: persistentVolumeClaim
      storageClass: longhorn
      size: 128Mi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
          - path: "/config"
    main-metadata:
      enabled: true
      type: persistentVolumeClaim
      storageClass: longhorn
      size: 512Mi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
          - path: "/metadata"
