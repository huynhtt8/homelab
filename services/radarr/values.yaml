app-template:
  fullnameOverride: radarr
  controllers:
    main:
      pod:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-type
                      operator: In
                      values:
                        - media-worker
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/radarr
            tag: latest
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
          - name: PUID
            value: '1000'
          - name: PGID
            value: '1000'
          - name: TZ
            value: Asia/Ho_Chi_Minh
          ports:
          - name: web
            containerPort: 7878
            hostPort: 7878
  service:
    main:
      enabled: true
      controller: main
      type: ClusterIP
      ports:
        web:
          enabled: true
          primary: true
          port: 7878
          protocol: HTTP
        http:
          enabled: false
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca
      tls:
        - hosts:
            - radarr.homelab.com
          secretName: radarr-tls
      hosts:
      - host: radarr.homelab.com
        paths:
        - path: "/"
          pathType: Prefix
          service:
            name: main
            port: web
  persistence:
    main-config:
      enabled: true
      type: persistentVolumeClaim
      storageClass: longhorn
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
          - path: "/config"
    main-media:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: media-share
      advancedMounts:
        main:
          main:
          - path: "/data"
