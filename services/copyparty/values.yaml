app-template:
  fullnameOverride: copyparty
  controllers:
    main:
      replicas: 1
      pod:
        nodeSelector:
          node-type: infra
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      containers:
        main:
          image:
            repository: copyparty/ac
            tag: latest
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: "/"
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 60
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: "/"
                  port: http
                initialDelaySeconds: 15
                periodSeconds: 60
            startup:
              enabled: false
          env:
          - name: TZ
            value: Asia/Ho_Chi_Minh
          ports:
          - name: http
            containerPort: 3923
  service:
    main:
      enabled: true
      controller: main
      type: ClusterIP
      ports:
        http:
          enabled: true
          primary: true
          port: 3923
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: traefik
      annotations: {}
      tls:
        - hosts:
            - copyparty.homelab.com
          secretName: copyparty-tls
      hosts:
      - host: copyparty.homelab.com
        paths:
        - path: "/"
          pathType: Prefix
          service:
            name: main
            port: http
  persistence:
    main-config:
      enabled: true
      type: persistentVolumeClaim
      storageClass: longhorn
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
          - path: "/cfg"
    main-share:
      enabled: true
      type: persistentVolumeClaim
      storageClass: longhorn
      size: 20Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
          - path: "/w"
