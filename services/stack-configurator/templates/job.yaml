apiVersion: batch/v1
kind: Job
metadata:
  name: stack-configurator
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  template:
    spec:
      serviceAccountName: stack-configurator
      restartPolicy: OnFailure
      containers:
        - name: configurator
          image: python:3.11-alpine
          command: ["/bin/sh", "-c", "pip install kubernetes requests && python /app/script.py"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: QBIT_USERNAME
              value: {{ .Values.qbit.username | quote }}
            - name: QBIT_SECRET_NAME
              value: {{ .Values.qbit.secretName | quote }}
            - name: QBIT_PASSWORD_KEY
              value: {{ .Values.qbit.passwordKey | quote }}
            - name: QBIT_DEFAULT_SAVE_PATH
              value: {{ .Values.qbit.defaultSavePath | quote }}
            - name: QBIT_INCOMPLETE_PATH
              value: {{ .Values.qbit.incompletePath | quote }}
            - name: QBIT_RADARR_CATEGORY_PATH
              value: {{ index .Values.qbit.categories "radarr" | quote }}
            - name: QBIT_SONARR_CATEGORY_PATH
              value: {{ index .Values.qbit.categories "sonarr" | quote }}
            - name: EXTERNAL_SECRET_ENABLED
              value: {{ .Values.externalSecret.enabled | quote }}
            - name: EXTERNAL_SECRET_NAME
              value: {{ .Values.externalSecret.name | quote }}
            - name: SECRET_STORE_NAME
              value: {{ .Values.externalSecret.secretStoreName | quote }}
            - name: REMOTE_SECRET_NAME
              value: {{ .Values.externalSecret.remoteSecretName | quote }}
            - name: REMOTE_PASSWORD_PROPERTY
              value: {{ .Values.externalSecret.remotePasswordProperty | quote }}
          volumeMounts:
            - name: script
              mountPath: /app/script.py
              subPath: script.py
      volumes:
        - name: script
          configMap:
            name: stack-configurator-script
