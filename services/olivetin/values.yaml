app-template:
  fullnameOverride: olivetin
  serviceAccount:
    create: false
    name: olivetin
  controllers:
    main:
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: jamesread/olivetin
            tag: latest
          env:
          - name: NAS_SSH_USER
            valueFrom:
              secretKeyRef:
                name: olivetin-power-control
                key: NAS_SSH_USER
          - name: MEDIA_WORKER_SSH_USER
            valueFrom:
              secretKeyRef:
                name: olivetin-power-control
                key: MEDIA_WORKER_SSH_USER
          - name: K3S_MASTER_SSH_USER
            valueFrom:
              secretKeyRef:
                name: olivetin-power-control
                key: K3S_MASTER_SSH_USER
          - name: NAS_HOST
            valueFrom:
              secretKeyRef:
                name: olivetin-power-control
                key: NAS_HOST
          - name: MEDIA_WORKER_HOST
            valueFrom:
              secretKeyRef:
                name: olivetin-power-control
                key: MEDIA_WORKER_HOST
          - name: K3S_MASTER_HOST
            valueFrom:
              secretKeyRef:
                name: olivetin-power-control
                key: K3S_MASTER_HOST
          - name: MEDIA_WORKER_NODE
            valueFrom:
              secretKeyRef:
                name: olivetin-power-control
                key: MEDIA_WORKER_NODE
          ports:
          - name: http
            containerPort: 1337
  service:
    main:
      enabled: true
      controller: main
      type: ClusterIP
      ports:
        http:
          enabled: true
          primary: true
          port: 1337
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca
      tls:
        - hosts:
            - power.homelab.com
          secretName: olivetin-tls
      hosts:
      - host: power.homelab.com
        paths:
        - path: "/"
          pathType: Prefix
          service:
            name: main
            port: http
  persistence:
    config:
      enabled: true
      type: configMap
      name: olivetin-config
      advancedMounts:
        main:
          main:
          - path: "/config/config.yaml"
            subPath: config.yaml
    ssh:
      enabled: true
      type: secret
      name: olivetin-power-control
      defaultMode: 384
      advancedMounts:
        main:
          main:
          - path: "/config/ssh/id_ed25519"
            subPath: id_ed25519
            readOnly: true
          - path: "/config/ssh/config"
            subPath: ssh_config
            readOnly: true
