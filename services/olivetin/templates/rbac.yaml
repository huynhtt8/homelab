apiVersion: v1
kind: ServiceAccount
metadata:
  name: olivetin
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: olivetin-node-viewer
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: olivetin-node-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: olivetin-node-viewer
subjects:
  - kind: ServiceAccount
    name: olivetin
    namespace: {{ .Release.Namespace }}
