apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: olivetin-power-control
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: central-secrets
  target:
    name: olivetin-power-control
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POWER_SSH_USER: "{{ `{{ .POWER_SSH_USER }}` }}"
        NAS_HOST: "{{ `{{ .NAS_HOST }}` }}"
        MEDIA_WORKER_HOST: "{{ `{{ .MEDIA_WORKER_HOST }}` }}"
        K3S_MASTER_HOST: "{{ `{{ .K3S_MASTER_HOST }}` }}"
        MEDIA_WORKER_NODE: "{{ `{{ .MEDIA_WORKER_NODE }}` }}"
        id_ed25519: "{{ `{{ .id_ed25519 }}` }}"
        ssh_config: |
          Host *
            IdentityFile /config/ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            PreferredAuthentications publickey
            PasswordAuthentication no
            StrictHostKeyChecking no
            UserKnownHostsFile /tmp/olivetin_known_hosts
  data:
    - secretKey: POWER_SSH_USER
      remoteRef:
        key: olivetin-power-control
        property: POWER_SSH_USER
    - secretKey: NAS_HOST
      remoteRef:
        key: olivetin-power-control
        property: NAS_HOST
    - secretKey: MEDIA_WORKER_HOST
      remoteRef:
        key: olivetin-power-control
        property: MEDIA_WORKER_HOST
    - secretKey: K3S_MASTER_HOST
      remoteRef:
        key: olivetin-power-control
        property: K3S_MASTER_HOST
    - secretKey: MEDIA_WORKER_NODE
      remoteRef:
        key: olivetin-power-control
        property: MEDIA_WORKER_NODE
    - secretKey: id_ed25519
      remoteRef:
        key: olivetin-power-control
        property: id_ed25519
