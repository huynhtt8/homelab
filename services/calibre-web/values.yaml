app-template:
  fullnameOverride: calibre-web
  controllers:
    main:
      pod:
        nodeSelector:
          node-type: infra
      containers:
        main:
          image:
            repository: crocodilestick/calibre-web-automated
            tag: latest
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
          - name: PUID
            value: '1000'
          - name: PGID
            value: '1000'
          - name: TZ
            value: Asia/Ho_Chi_Minh
          ports:
          - name: http
            containerPort: 8083
  service:
    main:
      enabled: true
      controller: main
      type: NodePort
      ports:
        http:
          enabled: true
          primary: true
          port: 8083
          nodePort: 31083
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca
      tls:
        - hosts:
            - calibre-web.homelab.com
          secretName: calibre-web-tls
      hosts:
      - host: calibre-web.homelab.com
        paths:
        - path: "/"
          pathType: Prefix
          service:
            name: main
            port: http
  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      storageClass: longhorn
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
          - path: "/config"
    books:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: media-share
      advancedMounts:
        main:
          main:
          - path: "/calibre-library"
            subPath: "books/calibre-library"
          - path: "/cwa-book-ingest"
            subPath: "books/calibre-ingest"
