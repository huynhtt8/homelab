server:
  port: 80
  cacheDir: /home/filebrowser/data/tmp
  sources:
    - path: /media-a
      name: Media A
      config:
        defaultEnabled: true
    - path: /media-b
      name: Media B
      config:
        defaultEnabled: true
    - path: /audiobookshelf-library
      name: Audiobookshelf Library
      config:
        defaultEnabled: true
    - path: /calibre-library
      name: Calibre Library
      config:
        defaultEnabled: true
    - path: /cwa-book-ingest
      name: CWA Book Ingest
      config:
        defaultEnabled: true

auth:
  adminUsername: admin
  methods:
    password:
      enabled: true
      minLength: 12

frontend:
  name: Worker Files
