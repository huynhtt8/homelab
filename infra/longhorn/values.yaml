longhorn:
  persistence:
    defaultClassReplicaCount: 3
    defaultNodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  defaultSettings:
    defaultReplicaCount: 3
    replicaSoftAntiAffinity: false
    storageMinimalAvailablePercentage: 10
    storageOverProvisioningPercentage: 100
    defaultDataLocality: best-effort
  defaultBackupStore:
    backupTarget: ""
  ingress:
    enabled: false
  service:
    ui:
      type: ClusterIP
  tolerations: []
  nodeSelector:
    node-type: infra
