traefik:
  fullnameOverride: traefik
  nodeSelector:
    node-type: infra
  deployment:
    replicas: 1
  ingressClass:
    name: traefik
    enabled: true
    isDefaultClass: true
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true
      allowExternalNameServices: true
      ingressEndpoint:
        hostname: traefik.homelab.com
  ingressRoute:
    dashboard:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca
      matchRule: Host(`traefik.homelab.com`)
      entryPoints:
        - websecure
      tls:
        secretName: traefik-dashboard-tls
  ports:
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      http:
        tls:
          enabled: true
  service:
    spec:
      type: LoadBalancer
  logs:
    general:
      level: INFO
